services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: 8000
    volumes:
      - ./backend:/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app/backend

  # Optional. Jobs currently live in-process; enable Redis if a job must survive restarts.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]
